[project]
name = "backend"
version = "0.1.0"
description = "GitHub data collection for tissue-bot via async REST API"
readme = "README.md"
authors = [
    { name = "mekanizeai", email = "mekanizeai@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "click>=8.4.1",
    "fastapi>=0.136.3",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "greenlet>=3.5.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.29",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
tissue = "backend.cli:main"
tissue-api = "backend.api.main:run"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
